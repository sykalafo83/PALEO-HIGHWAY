<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paleo Highway</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff6030">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Paleo Highway">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Tiny5&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #07050a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; box-shadow: 0 0 40px #000; }
  #screen { position: relative; z-index: 1; }
  #bezel { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; box-shadow: none; }
  /* sterowanie dotykowe */
  #touch { position: fixed; inset: 0; pointer-events: none; z-index: 5; touch-action: none; user-select: none; -webkit-user-select: none; }
  #touch.off { display: none; }
  #touch .tp { position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%; background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.35); color: rgba(255,255,255,0.8); font: bold 14px system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; }
  #touch .tp.on { background: rgba(255,200,80,0.35); }
  #touch .pad { left: 18px; bottom: 18px; width: 150px; height: 150px; }
  #touch .knob { position: absolute; width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,0.35); pointer-events: none; }
  #touch .ba { right: 22px; bottom: 70px; width: 74px; height: 74px; }
  #touch .bb { right: 106px; bottom: 22px; width: 68px; height: 68px; }
  #touch .bs { right: 18px; bottom: 160px; width: 54px; height: 54px; font-size: 11px; }
  #touch .bg { right: 112px; bottom: 108px; width: 54px; height: 54px; font-size: 11px; }
  #touch .bst { right: 50%; top: 10px; width: 64px; height: 30px; border-radius: 15px; font-size: 11px; transform: translateX(50%); }
</style>
</head>
<body style="touch-action:none">
<canvas id="screen" width="384" height="224"></canvas>
<script src="config.js"></script>
<script src="js/audio.js"></script>

<script src="js/stages/stage7.js"></script>
<script src="js/stages/stage8.js"></script>
<script src="js/stages/cages.js"></script>
<script src="js/stages/extras.js"></script>
<script src="js/stages/training.js"></script>
<script src="js/stages/survival.js"></script>
<script src="js/stages/escape.js"></script>

<script src="js/stages/custom.js"></script>

</body>
</html>
